name: Sami Quality & Security CI (الفحص الآلي والأمان)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Code Quality & Security Invariants Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Type Check & Lint Codebase
        run: npm run lint

      - name: Run Sami Channel Access & Security Verification Suite
        run: npx tsx scripts/test_channel_authorization.ts

      - name: Verify APK Signature & Package Metadata
        run: |
          if [ -f "Sami-Android.apk" ]; then
            npx tsx -e "
            import fs from 'fs';
            import { inspectApkBuffer } from './src/server/apkInspector.js';

            async function check() {
              const buf = fs.readFileSync('Sami-Android.apk');
              const res = await inspectApkBuffer({ buffer: buf, fileName: 'Sami-Android.apk', publishedVersionCode: 15 });
              if (!res.valid) {
                console.error('Errors:', res.errors);
                process.exit(1);
              }
              console.log('APK verification passed! Version:', res.versionName, 'Code:', res.versionCode);
            }
            check();
            "
          fi
